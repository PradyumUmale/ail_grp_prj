<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Zero-Sum Games Hub (Connect 4 & Quarto)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #1a73e8; margin-bottom: 5px; }
        .setup-panel { background: white; padding: 20px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        select, button { padding: 8px 14px; font-size: 1rem; border-radius: 6px; border: 1px solid #ccc; cursor: pointer; margin: 5px; }
        button { background-color: #1a73e8; color: white; border: none; font-weight: bold; }
        button:hover { background-color: #1557b0; }

        .game-container { display: none; }
        #status { font-size: 1.2rem; font-weight: bold; margin: 15px 0; color: #333; }

        /* Connect 4 Board */
        .c4-board { display: inline-grid; gap: 6px; background-color: #1a73e8; padding: 12px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); margin-bottom: 15px; }
        .c4-cell { width: 50px; height: 50px; background-color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .c4-cell.p1 { background-color: #ff4d4d; } /* Human */
        .c4-cell.p2 { background-color: #ffcc00; } /* AI */

        /* Quarto Board */
        .quarto-board { display: inline-grid; grid-template-columns: repeat(4, 75px); grid-template-rows: repeat(4, 75px); gap: 8px; background-color: #333; padding: 12px; border-radius: 12px; margin-bottom: 15px; }
        .quarto-cell { width: 75px; height: 75px; background-color: #eaeaea; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.8rem; font-weight: bold; border: 2px solid #ccc; }
        .quarto-cell.selected-target { border: 2px dashed #1a73e8; background-color: #e8f0fe; }

        /* Piece Tray */
        .piece-tray { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 450px; margin: 15px auto; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .piece-item { width: 45px; height: 45px; border: 2px solid #444; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.75rem; background: #fff; }
        .piece-item.selected { border-color: #1a73e8; background-color: #e8f0fe; transform: scale(1.1); font-weight: bold; }
        .piece-item.disabled { opacity: 0.3; cursor: not-allowed; }

        /* Modal Dialog */
        .modal { display: none; position: fixed; z-index: 10; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); min-width: 300px; }
    </style>
</head>
<body>

    <h1>AI Zero-Sum Games Hub</h1>
    <p>Minimax Algorithm with Alpha-Beta Pruning</p>

    <!-- Setup Panel -->
    <div class="setup-panel" id="setupPanel">
        <h3>Game Configuration</h3>
        <label><b>Select Game:</b></label>
        <select id="gameMode" onchange="toggleModeOptions()">
            <option value="connect4">Connect Four</option>
            <option value="quarto">Quarto</option>
        </select><br>

        <div id="c4Options">
            <label><b>Board Size:</b></label>
            <select id="c4Size">
                <option value="4,6,3">4 x 6 (3 to win)</option>
                <option value="5,7,4">5 x 7 (4 to win)</option>
                <option value="6,7,4" selected>6 x 7 Standard (4 to win)</option>
                <option value="8,9,5">8 x 9 (5 to win)</option>
            </select><br>
        </div>

        <label><b>Who plays first?</b></label>
        <select id="firstPlayer">
            <option value="human">Human (You)</option>
            <option value="ai">AI Agent</option>
        </select><br><br>

        <button onclick="startGame()">Start Game</button>
    </div>

    <!-- Active Game Container -->
    <div class="game-container" id="gameContainer">
        <div id="status">Your Turn</div>
        <div id="boardArea"></div>

        <div id="quartoControls" style="display:none;">
            <p><b>Your Selected Piece to Place:</b> <span id="currentSelectedPieceDisplay">None</span></p>
            <p><b>Pick a piece to hand over to the AI after clicking an empty cell:</b></p>
            <div class="piece-tray" id="pieceTray"></div>
            
            <div id="quartoActionBtn" style="margin-top: 15px;">
                <button onclick="submitQuartoTurn()" style="background-color: #28a745;">Confirm Quarto Move & Hand Piece to AI</button>
            </div>
        </div>
        <br>
        <button onclick="resetToSetup()">Switch Game / Setup</button>
    </div>

    <!-- Result Modal -->
    <div id="resultModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Game Over</h2>
            <p id="modalMessage">Winner</p>
            <button onclick="closeModal()">View Board</button>
            <button onclick="resetToSetup()">Play Again</button>
        </div>
    </div>

    <script>
        let gameState = {};
        let chosenPieceToGiveAI = null;
        let selectedCellForQuarto = null;

        function toggleModeOptions() {
            const mode = document.getElementById('gameMode').value;
            document.getElementById('c4Options').style.display = (mode === 'connect4') ? 'block' : 'none';
        }

        async function startGame() {
            const mode = document.getElementById('gameMode').value;
            const first_player = document.getElementById('firstPlayer').value;
            let payload = { mode, first_player };

            selectedCellForQuarto = null;
            chosenPieceToGiveAI = null;

            if (mode === 'connect4') {
                const parts = document.getElementById('c4Size').value.split(',');
                payload.rows = parseInt(parts[0]);
                payload.cols = parseInt(parts[1]);
                payload.connect_n = parseInt(parts[2]);
            }

            const res = await fetch('/start_game', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            gameState = await res.json();

            document.getElementById('setupPanel').style.display = 'none';
            document.getElementById('gameContainer').style.display = 'block';
            document.getElementById('quartoControls').style.display = (mode === 'quarto') ? 'block' : 'none';
            document.getElementById('resultModal').style.display = 'none';
            renderGame();
        }

        function closeModal() {
            document.getElementById('resultModal').style.display = 'none';
        }

        function renderGame() {
            const statusEl = document.getElementById('status');
            const boardArea = document.getElementById('boardArea');
            boardArea.innerHTML = '';

            statusEl.innerText = gameState.game_over ? "Game Over" : `Current Turn: ${gameState.turn === 'human' ? 'Your Turn' : 'AI Thinking...'}`;

            if (gameState.mode === 'connect4') {
                const boardEl = document.createElement('div');
                boardEl.className = 'c4-board';
                boardEl.style.gridTemplateColumns = `repeat(${gameState.cols}, 50px)`;
                boardEl.style.gridTemplateRows = `repeat(${gameState.rows}, 50px)`;

                for (let r = 0; r < gameState.rows; r++) {
                    for (let c = 0; c < gameState.cols; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'c4-cell';
                        if (gameState.board[r][c] === 1) cell.classList.add('p1');
                        if (gameState.board[r][c] === 2) cell.classList.add('p2');
                        
                        if (!gameState.game_over && gameState.turn === 'human') {
                            cell.onclick = () => makeC4Move(c);
                        }
                        boardEl.appendChild(cell);
                    }
                }
                boardArea.appendChild(boardEl);

            } else if (gameState.mode === 'quarto') {
                const boardEl = document.createElement('div');
                boardEl.className = 'quarto-board';

                document.getElementById('currentSelectedPieceDisplay').innerText = 
                    gameState.selected_piece !== null ? `Piece #${gameState.selected_piece}` : "None";

                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'quarto-cell';
                        const val = gameState.board[r][c];

                        if (val !== null) {
                            cell.innerText = `P#${val}`;
                            cell.style.background = "#d4edda";
                        } else {
                            cell.innerText = "Empty";
                            if (selectedCellForQuarto && selectedCellForQuarto.r === r && selectedCellForQuarto.c === c) {
                                cell.classList.add('selected-target');
                            }
                            if (!gameState.game_over && gameState.turn === 'human' && gameState.selected_piece !== null) {
                                cell.onclick = () => {
                                    selectedCellForQuarto = { r, c };
                                    renderGame();
                                };
                            }
                        }
                        boardEl.appendChild(cell);
                    }
                }
                boardArea.appendChild(boardEl);
                renderQuartoTray();
            }

            // Show winner modal after rendering the board
            if (gameState.game_over) {
                let msg = "It's a Tie!";
                if (gameState.winner === "Human") msg = "You Won! 🎉";
                else if (gameState.winner === "AI") msg = "AI Won! 🤖";
                document.getElementById('modalTitle').innerText = "Game Over";
                document.getElementById('modalMessage').innerText = msg;
                document.getElementById('resultModal').style.display = 'flex';
            }
        }

        function renderQuartoTray() {
            const tray = document.getElementById('pieceTray');
            tray.innerHTML = '';

            gameState.available_pieces.forEach(p => {
                const item = document.createElement('div');
                item.className = 'piece-item';
                item.innerText = `#${p}`;
                if (chosenPieceToGiveAI === p) item.classList.add('selected');

                if (!gameState.game_over) {
                    item.onclick = () => {
                        chosenPieceToGiveAI = p;
                        renderQuartoTray();
                    };
                }
                tray.appendChild(item);
            });
        }

        async function makeC4Move(col) {
            if (gameState.turn !== 'human' || gameState.game_over) return;
            const res = await fetch('/make_move', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ col })
            });
            gameState = await res.json();
            renderGame();
        }

        async function submitQuartoTurn() {
            if (gameState.game_over) return;
            if (!selectedCellForQuarto || chosenPieceToGiveAI === null) {
                alert("Please select an empty board cell AND a piece to hand over to the AI!");
                return;
            }

            const res = await fetch('/make_move', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    row: selectedCellForQuarto.r,
                    col: selectedCellForQuarto.c,
                    next_piece: chosenPieceToGiveAI
                })
            });
            const data = await res.json();
            if (data.error) {
                alert(data.error);
            } else {
                gameState = data;
                selectedCellForQuarto = null;
                chosenPieceToGiveAI = null;
                renderGame();
            }
        }

        function resetToSetup() {
            document.getElementById('resultModal').style.display = 'none';
            document.getElementById('gameContainer').style.display = 'none';
            document.getElementById('setupPanel').style.display = 'inline-block';
        }
    </script>
</body>
</html>
