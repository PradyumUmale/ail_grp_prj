<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Timetable Configuration Setup</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #1a73e8; text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #666; margin-top: 0; margin-bottom: 30px; }
        h3 { border-bottom: 2px solid #1a73e8; padding-bottom: 5px; color: #1a73e8; margin-top: 25px; }
        
        .row-group { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        input, select { padding: 8px 12px; font-size: 0.95rem; border: 1px solid #ccc; border-radius: 4px; flex: 1; }
        button.remove-btn { background-color: #dc3545; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
        button.add-btn { background-color: #28a745; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; margin-top: 5px; }
        
        .submit-container { text-align: center; margin-top: 30px; }
        button.generate-btn { background-color: #1a73e8; color: white; border: none; padding: 12px 30px; font-size: 1.1rem; border-radius: 6px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button.generate-btn:hover { background-color: #1557b0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>University Timetable Setup</h1>
        <p class="subtitle">Step 1: Configure Classes, Teachers, and Subject Requirements</p>

        <!-- Classes Setup -->
        <h3>Classes</h3>
        <div id="classesContainer">
            <div class="row-group"><input type="text" value="CS-Year 1" class="class-input"><button class="remove-btn" onclick="this.parentElement.remove()">X</button></div>
            <div class="row-group"><input type="text" value="CS-Year 2" class="class-input"><button class="remove-btn" onclick="this.parentElement.remove()">X</button></div>
            <div class="row-group"><input type="text" value="CS-Year 3" class="class-input"><button class="remove-btn" onclick="this.parentElement.remove()">X</button></div>
            <div class="row-group"><input type="text" value="CS-Year 4" class="class-input"><button class="remove-btn" onclick="this.parentElement.remove()">X</button></div>
        </div>
        <button class="add-btn" onclick="addClassRow()">+ Add Class</button>

        <!-- Teachers Setup -->
        <h3>Teachers & Max Daily Hours</h3>
        <div id="teachersContainer">
            <div class="row-group">
                <input type="text" value="Dr. Alan Turing" class="teacher-name" placeholder="Teacher Name">
                <input type="number" value="3" class="teacher-max" placeholder="Max Hours/Day" min="1" max="6">
                <button class="remove-btn" onclick="this.parentElement.remove()">X</button>
            </div>
            <div class="row-group">
                <input type="text" value="Dr. Ada Lovelace" class="teacher-name" placeholder="Teacher Name">
                <input type="number" value="3" class="teacher-max" placeholder="Max Hours/Day" min="1" max="6">
                <button class="remove-btn" onclick="this.parentElement.remove()">X</button>
            </div>
        </div>
        <button class="add-btn" onclick="addTeacherRow()">+ Add Teacher</button>

        <!-- Subjects Setup -->
        <h3>Subjects, Hours & Teacher Assignment</h3>
        <div id="subjectsContainer">
            <div class="row-group">
                <input type="text" value="Intro to Programming" class="subj-name" placeholder="Subject Name">
                <input type="text" value="CS101" class="subj-code" placeholder="Code (e.g. CS101)">
                <input type="text" value="CS-Year 1" class="subj-class" placeholder="Target Class">
                <input type="number" value="4" class="subj-hours" placeholder="Hours/Week" min="1" max="6">
                <input type="text" value="Dr. Alan Turing" class="subj-teacher" placeholder="Qualified Teacher">
                <button class="remove-btn" onclick="this.parentElement.remove()">X</button>
            </div>
        </div>
        <button class="add-btn" onclick="addSubjectRow()">+ Add Subject</button>

        <div class="submit-container">
            <button class="generate-btn" onclick="submitConfiguration()">⚡ Generate Timetables</button>
        </div>
    </div>

    <script>
        function addClassRow() {
            const container = document.getElementById('classesContainer');
            const div = document.createElement('div');
            div.className = 'row-group';
            div.innerHTML = `<input type="text" placeholder="Class Name" class="class-input"><button class="remove-btn" onclick="this.parentElement.remove()">X</button>`;
            container.appendChild(div);
        }

        function addTeacherRow() {
            const container = document.getElementById('teachersContainer');
            const div = document.createElement('div');
            div.className = 'row-group';
            div.innerHTML = `<input type="text" placeholder="Teacher Name" class="teacher-name"><input type="number" value="3" class="teacher-max" placeholder="Max Hours/Day" min="1" max="6"><button class="remove-btn" onclick="this.parentElement.remove()">X</button>`;
            container.appendChild(div);
        }

        function addSubjectRow() {
            const container = document.getElementById('subjectsContainer');
            const div = document.createElement('div');
            div.className = 'row-group';
            div.innerHTML = `
                <input type="text" placeholder="Subject Name" class="subj-name">
                <input type="text" placeholder="Code" class="subj-code">
                <input type="text" placeholder="Target Class" class="subj-class">
                <input type="number" value="3" placeholder="Hours/Wk" class="subj-hours" min="1" max="6">
                <input type="text" placeholder="Teacher Name" class="subj-teacher">
                <button class="remove-btn" onclick="this.parentElement.remove()">X</button>`;
            container.appendChild(div);
        }

        async function submitConfiguration() {
            const classes = Array.from(document.querySelectorAll('.class-input')).map(el => el.value.trim()).filter(Boolean);
            
            const teachers = {};
            document.querySelectorAll('#teachersContainer .row-group').forEach(row => {
                const name = row.querySelector('.teacher-name').value.trim();
                const max = parseInt(row.querySelector('.teacher-max').value) || 3;
                if (name) teachers[name] = { "max_hours_per_day": max };
            });

            const subjects = [];
            const teacher_allocations = {};
            Object.keys(teachers).forEach(t => teacher_allocations[t] = []);

            document.querySelectorAll('#subjectsContainer .row-group').forEach(row => {
                const name = row.querySelector('.subj-name').value.trim();
                const code = row.querySelector('.subj-code').value.trim();
                const cls = row.querySelector('.subj-class').value.trim();
                const hours = parseInt(row.querySelector('.subj-hours').value) || 3;
                const teacher = row.querySelector('.subj-teacher').value.trim();

                if (name && code && cls) {
                    subjects.push({ name, code, class: cls, hours_per_week: hours });
                    if (teacher && teacher_allocations[teacher]) {
                        if (!teacher_allocations[teacher].includes(code)) {
                            teacher_allocations[teacher].push(code);
                        }
                    } else if (teacher) {
                        teacher_allocations[teacher] = [code];
                    }
                }
            });

            const payload = { classes, teachers, subjects, teacher_allocations };

            const res = await fetch('/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.success) {
                window.location.href = data.redirect;
            } else {
                alert("Generation failed: " + data.error);
            }
        }
    </script>
</body>
</html>
