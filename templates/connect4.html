<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Connect Four - AI Hub</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #1a73e8; margin-bottom: 5px; }
        #status { font-size: 1.2rem; font-weight: bold; margin: 15px 0; color: #333; }
        
        /* Connect 4 Board */
        .c4-board { display: inline-grid; gap: 8px; background-color: #1a73e8; padding: 15px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); }
        .c4-cell { width: 55px; height: 55px; background-color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s; }
        .c4-cell.p1 { background-color: #ff4d4d; } /* Human */
        .c4-cell.p2 { background-color: #ffcc00; } /* AI */
        
        /* Modal Dialog */
        .modal { display: none; position: fixed; z-index: 10; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); min-width: 300px; }
        button { padding: 10px 18px; font-size: 1rem; border-radius: 6px; border: none; background-color: #1a73e8; color: white; font-weight: bold; cursor: pointer; margin: 5px; }
        button:hover { background-color: #1557b0; }
        .btn-secondary { background-color: #6c757d; }
        .btn-secondary:hover { background-color: #5a6268; }
    </style>
</head>
<body>

    <h1>Connect Four</h1>
    <div id="status">Loading game state...</div>
    <div id="boardArea"></div>
    <br>
    <button class="btn-secondary" onclick="window.location.href='/'">Back to Setup</button>

    <!-- Result Modal -->
    <div id="resultModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Game Over</h2>
            <p id="modalMessage">Winner</p>
            <button class="btn-secondary" onclick="closeModal()">View Board</button>
            <button onclick="window.location.href='/'">Play Again</button>
        </div>
    </div>

    <script>
        let gameState = {};

        async function fetchState() {
            const res = await fetch('/get_state');
            gameState = await res.json();
            renderGame();
        }

        function closeModal() {
            document.getElementById('resultModal').style.display = 'none';
        }

        function renderGame() {
            const statusEl = document.getElementById('status');
            const boardArea = document.getElementById('boardArea');
            boardArea.innerHTML = '';

            statusEl.innerText = gameState.game_over ? "Game Over" : `Current Turn: ${gameState.turn === 'human' ? 'Your Turn' : 'AI Thinking...'}`;

            const boardEl = document.createElement('div');
            boardEl.className = 'c4-board';
            boardEl.style.gridTemplateColumns = `repeat(${gameState.cols}, 55px)`;
            boardEl.style.gridTemplateRows = `repeat(${gameState.rows}, 55px)`;

            for (let r = 0; r < gameState.rows; r++) {
                for (let c = 0; c < gameState.cols; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'c4-cell';
                    if (gameState.board[r][c] === 1) cell.classList.add('p1');
                    if (gameState.board[r][c] === 2) cell.classList.add('p2');
                    
                    if (!gameState.game_over && gameState.turn === 'human') {
                        cell.onclick = () => makeMove(c);
                    }
                    boardEl.appendChild(cell);
                }
            }
            boardArea.appendChild(boardEl);

            if (gameState.game_over) {
                let msg = "It's a Tie!";
                if (gameState.winner === "Human") msg = "You Won! 🎉";
                else if (gameState.winner === "AI") msg = "AI Won! 🤖";
                document.getElementById('modalTitle').innerText = "Game Over";
                document.getElementById('modalMessage').innerText = msg;
                document.getElementById('resultModal').style.display = 'flex';
            }
        }

        async function makeMove(col) {
            if (gameState.turn !== 'human' || gameState.game_over) return;
            const res = await fetch('/make_move', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ col })
            });
            gameState = await res.json();
            renderGame();
        }

        fetchState();
    </script>
</body>
</html>
