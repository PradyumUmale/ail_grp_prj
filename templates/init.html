<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Zero-Sum Games - Setup</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; text-align: center; margin: 0; padding: 40px 20px; }
        h1 { color: #1a73e8; margin-bottom: 5px; }
        .setup-panel { background: white; padding: 30px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { font-weight: bold; display: block; margin-bottom: 8px; color: #444; }
        select, button { width: 100%; padding: 10px; font-size: 1rem; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #1a73e8; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #1557b0; }
    </style>
</head>
<body>

    <h1>AI Zero-Sum Games Hub</h1>
    <p>Select your game and configuration to begin</p>

    <div class="setup-panel">
        <form action="/start_game" method="POST">
            <div class="form-group">
                <label for="mode">Select Game:</label>
                <select id="mode" name="mode" onchange="toggleModeOptions()">
                    <option value="connect4">Connect Four</option>
                    <option value="quarto">Quarto</option>
                </select>
            </div>

            <div class="form-group" id="c4Options">
                <label for="c4Size">Board Size:</label>
                <select id="c4Size" name="c4Size">
                    <option value="4,6,3">4 x 6 (3 to win)</option>
                    <option value="5,7,4">5 x 7 (4 to win)</option>
                    <option value="6,7,4" selected>6 x 7 Standard (4 to win)</option>
                    <option value="8,9,5">8 x 9 (5 to win)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="first_player">Who plays first?</label>
                <select id="first_player" name="first_player">
                    <option value="human">Human (You)</option>
                    <option value="ai">AI Agent</option>
                </select>
            </div>

            <button type="submit">Start Game</button>
        </form>
    </div>

    <script>
        function toggleModeOptions() {
            const mode = document.getElementById('mode').value;
            document.getElementById('c4Options').style.display = (mode === 'connect4') ? 'block' : 'none';
        }
    </script>
</body>
</html>
